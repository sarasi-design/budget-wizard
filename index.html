<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hi-fi · Budget Wizard (all 6 steps)</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Phosphor Icons (regular + bold + fill weights) -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

  <style>
    html, body { margin: 0; padding: 0; background: #0d0912; font-family: 'Outfit', system-ui, sans-serif; color: #f5f1fb; letter-spacing: -0.012em; -webkit-font-smoothing: antialiased; }
    :root { --wizard-bg: #17111f; color-scheme: dark; } /* the wizard surface behind the cards — tweakable */
    *, *::before, *::after { box-sizing: border-box; }
    button { font: inherit; font-weight: 600 !important; cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: background-color 260ms ease, color 260ms ease, box-shadow 260ms ease !important; }
    /* click: a faint glow blooms on the card surface around the pressed control */
    .hifi-bloom { position: absolute; width: 760px; height: 760px; margin: -380px 0 0 -380px; border-radius: 50%; pointer-events: none; z-index: 0;
      background: radial-gradient(circle closest-side, rgba(201,168,255,0.13) 0%, rgba(201,168,255,0.10) 10%, rgba(201,168,255,0.065) 22%, rgba(201,168,255,0.035) 38%, rgba(201,168,255,0.015) 56%, rgba(201,168,255,0.005) 75%, transparent 100%); filter: blur(24px);
      transform: scale(0.5); opacity: 0; animation: hifiBloom 1300ms cubic-bezier(0.2,0.6,0.2,1) forwards; }
    @keyframes hifiBloom { 0% { transform: scale(0.5); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .hifi-bloom { display: none; } }
    button span[style*="font-size: 14px"]:not(.mono) { font-weight: 600 !important; }
    button .mono { font-weight: 500 !important; }
    .hifi-tip { position: fixed; z-index: 9999; max-width: 320px; padding: 8px 12px; border-radius: 12px; pointer-events: none;
      background: #2b2040; color: #f5f1fb; font-size: 14px; line-height: 1.4; font-weight: 400; letter-spacing: -0.01em;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 12px 32px rgba(0,0,0,0.5);
      opacity: 0; transform: translateY(4px); transition: opacity 160ms ease, transform 160ms ease; }
    .hifi-tip.on { opacity: 1; transform: none; }
    a { color: #c9a8ff; } a:hover { color: #e2d2ff; }
    ::placeholder { color: #a99dbf; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; }

    /* Visible keyboard focus — WCAG 2.4.7. !important overrides the inline
       outline:none on the amount inputs and shows on the invisible range overlays. */
    :focus-visible { outline: 3px solid #c9a8ff !important; outline-offset: 2px !important; border-radius: 3px; }
    /* keep mouse clicks clean — only show the ring for keyboard users */
    :focus:not(:focus-visible) { outline: none; }

    @property --circle-x {
      syntax: '<number>';
      inherits: true;
      initial-value: 0.28;
    }
    @keyframes pillExit {
      /* full pill → circle (diameter = pill height) → fade out, with eased collapse */
      0%   { transform: scaleX(1);                        opacity: 1; animation-timing-function: cubic-bezier(0.7, 0, 0.84, 0); }
      55%  { transform: scaleX(var(--circle-x, 0.28));    opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
      100% { transform: scaleX(var(--circle-x, 0.28));    opacity: 0; }
    }
    @keyframes pillEnter {
      /* fade in as circle → expand back to full pill, with eased grow */
      0%   { transform: scaleX(var(--circle-x, 0.28));    opacity: 0; animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); }
      30%  { transform: scaleX(var(--circle-x, 0.28));    opacity: 1; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
      100% { transform: scaleX(1);                        opacity: 1; }
    }

    html, body { min-height: 100%; background: var(--wizard-bg, #17111f); }
    body { background-image: radial-gradient(1100px 520px at 18% -10%, rgba(130,87,230,0.28), transparent 60%), radial-gradient(900px 500px at 100% 0%, rgba(240,122,184,0.10), transparent 60%); background-attachment: fixed; }
    #stage-wrap { position: relative; z-index: 1; }
    #stage-wrap, #stage, #root { width: 100%; min-height: 100vh; }
    /* animated background grid */
    .bg-grid, .bg-grid::after { position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: linear-gradient(to right, var(--grid-c) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-c) 1px, transparent 1px);
      background-size: 64px 64px; background-position: center top; }
    .bg-grid { --grid-c: rgba(201,168,255,0.055);
      -webkit-mask-image: radial-gradient(ellipse 85% 70% at 50% 0%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 85% 70% at 50% 0%, #000 30%, transparent 85%);
      animation: gridBreathe 14s ease-in-out infinite; }
    .bg-grid::after { content: ''; --grid-c: rgba(201,168,255,0.22);
      -webkit-mask-image: radial-gradient(circle 260px, #000 0%, transparent 70%); mask-image: radial-gradient(circle 260px, #000 0%, transparent 70%);
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
      animation: gridSweep 26s ease-in-out infinite; }
    @keyframes gridBreathe { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }
    @keyframes gridSweep {
      0%   { -webkit-mask-position: -30vw -10vh; mask-position: -30vw -10vh; }
      50%  { -webkit-mask-position: 30vw 20vh;   mask-position: 30vw 20vh; }
      100% { -webkit-mask-position: -30vw -10vh; mask-position: -30vw -10vh; } }
    /* cursor-following card highlight (desktop pointers only) */
    @media (hover: hover) and (pointer: fine) {
      .hifi-card::before, .hifi-card::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 500ms ease; }
      .hifi-card::before { padding: 1px;
        background: radial-gradient(800px circle at var(--mx, 50%) var(--my, 50%), rgba(201,168,255,0.32) 0%, rgba(201,168,255,0.24) 12%, rgba(201,168,255,0.15) 28%, rgba(201,168,255,0.08) 45%, rgba(201,168,255,0.03) 65%, transparent 85%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
      .hifi-card::after { background: radial-gradient(700px circle at var(--mx, 50%) var(--my, 50%), rgba(201,168,255,0.035) 0%, rgba(201,168,255,0.02) 30%, rgba(201,168,255,0.008) 55%, transparent 80%); }
      .hifi-card.is-lit::before, .hifi-card.is-lit::after { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .bg-grid, .bg-grid::after { animation: none; } .bg-grid::after { display: none; } }
    /* hide the step-pill scrollbar on mobile */
    .hifi-pillstrip::-webkit-scrollbar { display: none; }
    .hifi-pillstrip { scrollbar-width: none; }
    .hifi-loader{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;animation:hifiLoaderIn 400ms ease both}.hifi-loader-bars{display:flex;align-items:center;gap:8px;height:56px}.hifi-loader-bars span{width:10px;height:14px;border-radius:999px;animation:hifiBar 1.4s cubic-bezier(.45,0,.55,1) infinite}.hifi-loader-bars span:nth-child(1){background:#e2d8ff}.hifi-loader-bars span:nth-child(2){background:#9a72ec;animation-delay:.18s}.hifi-loader-bars span:nth-child(3){background:#c08af0;animation-delay:.36s}.hifi-loader-text{font-family:Outfit,system-ui,sans-serif;font-size:14px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(245,241,251,0.72)}@keyframes hifiBar{0%,100%{height:14px;opacity:.7}50%{height:56px;opacity:1}}@keyframes hifiLoaderIn{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion: reduce){.hifi-loader-bars span{animation:none;height:32px}}
    .preset-scroll{scrollbar-width:thin;scrollbar-color:rgba(190,165,255,0.45) transparent}.preset-scroll::-webkit-scrollbar{width:6px}.preset-scroll::-webkit-scrollbar-thumb{background:rgba(190,165,255,0.45);border-radius:999px}.preset-scroll::-webkit-scrollbar-track{background:transparent}.preset-arrow{transition:background 160ms ease,border-color 160ms ease,box-shadow 160ms ease,translate 160ms ease}.preset-arrow:hover,.preset-arrow:focus-visible{background:#6234c2 !important;border-color:rgba(226,216,255,0.8) !important;box-shadow:0 0 0 4px rgba(154,114,236,0.28),0 8px 22px rgba(10,4,24,0.6) !important;translate:0 2px;outline:none}.preset-arrow:active{translate:0 3px;background:#5228ad !important}
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1a1228"/><rect x="29" width="12" rx="6" fill="#e2d8ff" y="40" height="20"><animate attributeName="height" values="12;40;12" dur="1.4s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/><animate attributeName="y" values="44;30;44" dur="1.4s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect><rect x="44" width="12" rx="6" fill="#9a72ec" y="40" height="20"><animate attributeName="height" values="12;40;12" dur="1.4s" begin="0.18s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/><animate attributeName="y" values="44;30;44" dur="1.4s" begin="0.18s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect><rect x="59" width="12" rx="6" fill="#c08af0" y="40" height="20"><animate attributeName="height" values="12;40;12" dur="1.4s" begin="0.36s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/><animate attributeName="y" values="44;30;44" dur="1.4s" begin="0.36s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect></svg>
  </template>
  <div class="bg-grid" aria-hidden="true"></div>
  <div id="stage-wrap">
    <div id="stage"><div id="root"><div class="hifi-loader" role="status" aria-label="Loading"><div class="hifi-loader-bars"><span></span><span></span><span></span></div></div></div></div>
  </div>
  <div id="tweaks-root"></div>

  <script>
    // tooltip with the full text for anything truncated by an ellipsis
    (function () {
      var tip = document.createElement('div'); tip.className = 'hifi-tip'; tip.setAttribute('role', 'tooltip');
      document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(tip); });
      var cur = null;
      function truncated(el) {
        for (var n = el, i = 0; n && n.nodeType === 1 && i < 4; n = n.parentElement, i++) {
          if (getComputedStyle(n).textOverflow === 'ellipsis' && n.scrollWidth > n.clientWidth + 1) return n;
        }
        return null;
      }
      function hide() { cur = null; tip.classList.remove('on'); }
      document.addEventListener('pointerover', function (e) {
        var el = truncated(e.target);
        if (!el) { if (cur && !cur.contains(e.target)) hide(); return; }
        if (el === cur) return;
        cur = el; tip.textContent = el.textContent.trim();
        if (el.title) { el.dataset.tip = el.title; el.removeAttribute('title'); }
        var r = el.getBoundingClientRect();
        tip.style.left = '0px'; tip.style.top = '0px'; tip.classList.add('on');
        var tw = tip.offsetWidth, th = tip.offsetHeight;
        var left = Math.max(8, Math.min(innerWidth - tw - 8, r.left));
        var top = r.top - th - 8; if (top < 8) top = r.bottom + 8;
        tip.style.left = left + 'px'; tip.style.top = top + 'px';
      }, { passive: true });
      document.addEventListener('pointerout', function (e) { if (cur && (!e.relatedTarget || !cur.contains(e.relatedTarget))) hide(); }, { passive: true });
      addEventListener('scroll', hide, { passive: true, capture: true });
    })();
    // click: bloom on the surrounding card surface, centred on the pressed button
    document.addEventListener('pointerdown', function (e) {
      var b = e.target.closest && e.target.closest('button, [role="slider"]');
      if (!b || b.disabled) return;
      var card = b.closest('.hifi-card');
      if (!card) return;
      var cr = card.getBoundingClientRect(), br = b.getBoundingClientRect();
      var s = document.createElement('span');
      s.className = 'hifi-bloom';
      s.style.left = (br.left + br.width / 2 - cr.left) + 'px';
      s.style.top = (br.top + br.height / 2 - cr.top) + 'px';
      card.insertBefore(s, card.firstChild);
      setTimeout(function () { s.remove(); }, 1350);
    }, { passive: true });
  </script>
  <script>
    (function () {
      if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
      var x = 0, y = 0, raf = 0, R = 260;
      function paint() {
        raf = 0;
        document.querySelectorAll('.hifi-card').forEach(function (c) {
          var r = c.getBoundingClientRect();
          var near = x > r.left - R && x < r.right + R && y > r.top - R && y < r.bottom + R;
          c.classList.toggle('is-lit', near);
          if (near) { c.style.setProperty('--mx', (x - r.left) + 'px'); c.style.setProperty('--my', (y - r.top) + 'px'); }
        });
      }
      addEventListener('pointermove', function (e) { x = e.clientX; y = e.clientY; if (!raf) raf = requestAnimationFrame(paint); }, { passive: true });
      document.addEventListener('pointerleave', function () { document.querySelectorAll('.hifi-card.is-lit').forEach(function (c) { c.classList.remove('is-lit'); }); });
    })();
  </script>
  <script type="text/babel" src="hifi-kit.jsx"></script>
  <script type="text/babel" src="hifi-step1-income.jsx"></script>
  <script type="text/babel" src="hifi-step2-fixed.jsx"></script>
  <script type="text/babel" src="hifi-step3-deps.jsx"></script>
  <script type="text/babel" src="hifi-step4-allocate.jsx"></script>
  <script type="text/babel" src="hifi-step5-invest.jsx"></script>
  <script type="text/babel" src="hifi-step6-plan.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel">
    const INITIAL_STATE = {
      income: 1800,
      incomeIsGross: false,
      taxMode: 'auto',
      manualRate: 0.22,
      freq: 'monthly',
      employment: 'salaried',

      fixedItems: [
        { id: 'rent',   icon: 'home',   label: 'Rent',           amount: 800, sharedPct: 50 },
        { id: 'util',   icon: 'bolt',   label: 'Utilities',      amount: 90 },
        { id: 'phone',  icon: 'phone',  label: 'Phone + internet',amount: 45 },
        { id: 'food',   icon: 'cart',   label: 'Groceries',      amount: 240 },
        { id: 'trans',  icon: 'car',    label: 'Transport',      amount: 55 },
        { id: 'ins',    icon: 'shield', label: 'Insurance',      amount: 45 },
        { id: 'gym',    icon: 'gym',    label: 'Gym membership', amount: 25 },
        { id: 'sub',    icon: 'flame',  label: 'Subscriptions',  amount: 20 },
      ],
      rentType: 'rent',

      dependents: [
        { id: 'd1', type: 'child', name: 'Lucía',  amount: 150 },
        { id: 'd2', type: 'pet',   name: 'Misu',   amount: 30  },
      ],

      split: { e: 40, l: 40, f: 20 },
      picks: ['letras', 'msci-world', 'pension'],
    };

    const STORAGE_KEY = 'budgetWizard.v2';
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return { ...INITIAL_STATE, ...JSON.parse(raw) };
      } catch (e) { /* ignore */ }
      return INITIAL_STATE;
    }

    function App() {
      const [step, setStep] = React.useState(() => {
        const s = parseInt(new URLSearchParams(location.search).get('step'), 10);
        return Number.isFinite(s) ? Math.max(0, Math.min(5, s)) : 0;
      });
      const [state, setState] = React.useState(loadState);
      const [horizon, setHorizon] = React.useState(30);
      const update = (patch) => setState(s => ({ ...s, ...patch }));

      // persist on every change
      React.useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      }, [state]);

      const goTo = (i) => setStep(Math.max(0, Math.min(5, i)));
      const next = () => goTo(step + 1);
      const back = () => goTo(step - 1);

      const reset = () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        setState(INITIAL_STATE);
        setStep(0);
      };

      const StepComp = [
        StepIncome, StepFixed, StepDeps, StepAllocate, StepInvest, StepPlan,
      ][step];

      // Reset only surfaces once the user has actually changed something from the defaults.
      const canReset = React.useMemo(
        () => JSON.stringify(state) !== JSON.stringify(INITIAL_STATE),
        [state]
      );

      const isMobile = useHifiMobile();

      // single source of truth for the top-bar primary action
      const NEXT_LABELS = ['Continue to fixed costs', 'Continue to dependents', 'Continue to allocate', 'Continue to invest', 'See plan'];
      const isLast = step === 5;
      const primaryLabel = isLast ? 'Download plan' : NEXT_LABELS[step];
      const primaryIcon  = isLast ? 'download-simple' : 'arrow-right';
      const onPrimary    = isLast ? () => generatePlanPdf(state, horizon) : next;

      return (
        <div style={{
          width: '100%',
          minHeight: '100vh',
          padding: isMobile ? '14px max(14px, calc((100% - 760px) / 2)) 28px' : '32px max(36px, calc((100% - 1440px) / 2))',
          background: 'transparent',
          display: 'flex',
          flexDirection: 'column',
        }}>
          <HifiTopBar step={step} onStep={goTo} onReset={reset} canReset={canReset}
            primaryLabel={primaryLabel} primaryIcon={primaryIcon} onPrimary={onPrimary} />
          <StepComp state={state} update={update} onNext={next} onReset={reset} horizon={horizon} setHorizon={setHorizon} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- Tweaks panel — mounted OUTSIDE #stage so position:fixed isn't broken by the
       stage's transform:scale(). Tweaks only touch DOM outside React, so this
       subtree stays fully decoupled from the wizard app. -->
  <script type="text/babel">
    const WIZ_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "wizardBg": "#17111f"
    }/*EDITMODE-END*/;

    function TweaksController() {
      const [t, setTweak] = useTweaks(WIZ_TWEAK_DEFAULTS);
      React.useEffect(() => {
        document.documentElement.style.setProperty('--wizard-bg', t.wizardBg);
      }, [t.wizardBg]);
      return (
        <TweaksPanel title="Tweaks">
          <TweakSection label="Surface" />
          <TweakColor label="Background" value={t.wizardBg}
            options={['#17111f', '#1d1428', '#120d19', '#221a2e']}
            onChange={(v) => setTweak('wizardBg', v)} />
        </TweaksPanel>
      );
    }

    ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<TweaksController />);
  </script>
</body>
